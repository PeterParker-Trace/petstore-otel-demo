# OpenTelemetry Collector configuration — Phase 3 diagnostic version.
# Coralogix-only (no debug fallback) so any export failure surfaces immediately.
# Verbose self-telemetry so we can monitor exporter health from outside.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://localhost:*"
            - "http://127.0.0.1:*"

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
    send_batch_max_size: 2048

  resource:
    attributes:
      - key: deployment.environment
        value: local-dev
        action: upsert

exporters:
  coralogix:
    domain: "eu2.coralogix.com"
    private_key: "${env:CORALOGIX_PRIVATE_KEY}"
    application_name: "petstore"
    subsystem_name: "default"
    application_name_attributes:
      - "service.namespace"
    subsystem_name_attributes:
      - "service.name"
    timeout: "30s"
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 5000

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [coralogix]

    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [coralogix]

    logs:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [coralogix]

  telemetry:
    # Bump to debug so we see WHY exporters fail to load.
    logs:
      level: debug
    # Expose self-metrics on 0.0.0.0:8888 (instead of localhost-only).
    # We map this port in docker-compose so we can hit it from the Mac.
    metrics:
      address: 0.0.0.0:8888
      level: detailed
